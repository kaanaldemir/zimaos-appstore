{
  "name": "kaan-shinobi",
  "services": {
    "shinobi": {
      "image": "ghcr.io/kaanaldemir/shinobi-zimaos:latest",
      "restart": "unless-stopped",
      "ports": [
        {
          "target": 8080,
          "published": "8081",
          "protocol": "tcp"
        }
      ],
      "environment": {
        "DB_HOST": "database",
        "DB_USER": "shinobi",
        "DB_PASSWORD": "",
        "DB_DATABASE": "ccio",
        "SHINOBI_UPDATE": "false",
        "TZ": "Europe/Istanbul"
      },
      "volumes": [
        "/DATA/AppData/kaan-shinobi/config:/home/Shinobi",
        "/DATA/AppData/kaan-shinobi/videos:/home/Shinobi/videos"
      ],
      "depends_on": {
        "database": {
          "condition": "service_healthy"
        }
      },
      "entrypoint": [
        "/bin/bash",
        "-ec"
      ],
      "command": [
        "if [ -z \"$$(mysql -h \"$$DB_HOST\" -u \"$$DB_USER\" -p\"$$DB_PASSWORD\" \"$$DB_DATABASE\" -Nse \"SHOW TABLES LIKE 'Users'\")\" ]; then mysql -h \"$$DB_HOST\" -u \"$$DB_USER\" -p\"$$DB_PASSWORD\" \"$$DB_DATABASE\" < /opt/shinobi/sql/framework.sql; fi; exec /entrypoint.sh"
      ]
    },
    "database": {
      "image": "mariadb:10.11",
      "restart": "unless-stopped",
      "environment": {
        "MARIADB_ROOT_PASSWORD": "",
        "MARIADB_DATABASE": "ccio",
        "MARIADB_USER": "shinobi",
        "MARIADB_PASSWORD": ""
      },
      "volumes": [
        "/DATA/AppData/kaan-shinobi/database:/var/lib/mysql"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 12
      }
    }
  },
  "x-casaos": {
    "id": "com.kaanaldemir.shinobi",
    "main": "shinobi",
    "index": "/",
    "port_map": "8081",
    "scheme": "http",
    "icon": "https://raw.githubusercontent.com/kaanaldemir/zimaos-appstore/main/Apps/Shinobi/icon.svg",
    "title": {
      "en_US": "Shinobi",
      "tr_TR": "Shinobi"
    },
    "tagline": {
      "en_US": "Kamera kaydı ve izleme; Intel FFmpeg destekli imaj.",
      "tr_TR": "Kamera kaydı ve izleme; Intel FFmpeg destekli imaj."
    },
    "description": {
      "en_US": "Kamera kaydı ve izleme; Intel FFmpeg destekli imaj.",
      "tr_TR": "Kamera kaydı ve izleme; Intel FFmpeg destekli imaj."
    },
    "author": "kaanaldemir",
    "developer": "Shinobi Systems / kaanaldemir",
    "category": "Media",
    "architectures": [
      "amd64"
    ],
    "version": "1.0.0",
    "repo": "https://github.com/kaanaldemir/shinobi-zimaos-image",
    "tips": {
      "before_install": {
        "en_US": "İki servisteki veritabanı şifrelerini eşleştirin ve root şifresini değiştirin. İlk yönetici: /super, admin@shinobi.video / admin; hemen değiştirin. GPU hızlandırma için mevcutsa /dev/dri aygıtını ekleyin. Mevcut kamera verilerini otomatik devralmaz.",
        "tr_TR": "İki servisteki veritabanı şifrelerini eşleştirin ve root şifresini değiştirin. İlk yönetici: /super, admin@shinobi.video / admin; hemen değiştirin. GPU hızlandırma için mevcutsa /dev/dri aygıtını ekleyin. Mevcut kamera verilerini otomatik devralmaz."
      }
    }
  }
}
